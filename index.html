<html>
<link rel="stylesheet" href="style.css">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
    <input type="tel" id="mobileInput" maxlength="5" inputmode="numeric" style="opacity:0; position:absolute; z-index:-1;">
    <header>
        <h1> Numdle </h1>
        <h2 id="winstreak">0</h2>
        <hr>
    </header>
    <div id="winner">
        <button id = "close" onclick="closeWinLose('winner')"> ❌ </button>
        <p id="myPara"> 🥳 Congrats you won! 🥳</p>
        <p> RAHHHHHHHHH </p>
        <img src="images/squirtle-celebrate.gif" alt="pokemon-win"> </img> 
        <hr>
        <button id ="reset" onclick="resetGame()"> Play again! </button>
    </div>
    <div id="loser">
        <button id="close" onclick="closeWinLose('loser')"> ❌ </button>
        <p> 😓 NOOOO you lost! 😓</p>
        <p > booooo, try again next time :( </p>
        <p id="loseText"></p>
        <img src="images/ditto-lose.gif" alt="pokemon-los"> </img>
        <hr>
        <button id ="reset" onclick="resetGame()"> Try again! </button>
    </div>
    <div id="game"></div>
    

    <script src="wordle.js"> </script>
    
</body>
</html>
